name: Driver build validation

on:
  push:
    branches:
      - ci/issue-1-driver-build-3287d9d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install WDK 26100
        shell: pwsh
        run: winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
      - name: Build driver
        shell: pwsh
        run: msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:WindowsTargetPlatformVersion=10.0.26100.0
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: warn