name: Driver build validation

on:
  push:
    branches:
      - ci/issue-1-driver-build-3287d9d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install WDK 26100.6584
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne 'ED82C46BD98E0F1D07FD6E5075900E42AEDC3FA5E68C06A8764B3DC5303CFF1B') { throw "WDK installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installer failed: $($process.ExitCode)" }
      - name: Build driver
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'Win32', 'ARM64') {
            msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=$platform /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:KmdfVersion=1.11
            if ($LASTEXITCODE -ne 0) { throw "Driver build failed for $platform" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: error