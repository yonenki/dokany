name: Driver build validation

on:
  push:
    branches:
      - ci/issue-1-driver-build-3287d9d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-current:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install WDK 26100.6584
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne 'ED82C46BD98E0F1D07FD6E5075900E42AEDC3FA5E68C06A8764B3DC5303CFF1B') { throw "WDK installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installer failed: $($process.ExitCode)" }
      - name: Build driver
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=$platform /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:TargetVersion=Windows10 /p:KmdfVersion=1.15 /p:SignMode=Off
            if ($LASTEXITCODE -ne 0) { throw "Driver build failed for $platform" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: |
            sys/**/Release/Driver/**
            sys/**/Release/*.pdb
          if-no-files-found: error

  driver-x86-source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install WDK 19041.5738 for x86 validation
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/1b122713-4a55-4a95-8848-279de832a4c9/wdk/wdksetup.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne '596D51830EDA95C17486BCE114ECCE3D6DAFE7FECFBDE037828A6FCBC9D4865A') { throw "WDK installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installer failed: $($process.ExitCode)" }
      # WDK 22H2 and newer intentionally removed x86 kernel-driver targets.
      # WDK 19041 supports x86, but its MSBuild integration supports VS 2019,
      # while windows-2022 provides VS 2022. Compile every driver translation
      # unit directly so changes remain x86-clean; the upstream VS 2019 job is
      # still the authority for linking and packaging the legacy x86 driver.
      - name: Compile all driver sources for x86
        shell: pwsh
        run: |
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $kitVersion = '10.0.19041.0'
          $mc = Join-Path $kitsRoot "bin\$kitVersion\x64\mc.exe"
          $includeRoot = Join-Path $kitsRoot "Include\$kitVersion"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $toolsVersion = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          $cl = Join-Path $vs "VC\Tools\MSVC\$toolsVersion\bin\Hostx64\x86\cl.exe"

          $sourceDir = (Resolve-Path 'sys').Path
          $outputDir = Join-Path $env:RUNNER_TEMP 'dokan-x86-objects'
          $messageDir = Join-Path $env:RUNNER_TEMP 'dokan-x86-messages'
          $messageInclude = Join-Path $messageDir 'include'
          New-Item -ItemType Directory -Force -Path $outputDir, $messageDir, $messageInclude | Out-Null

          & $mc -h $messageDir -r $messageDir (Join-Path $sourceDir 'dokanfs_msg.mc')
          if ($LASTEXITCODE -ne 0) { throw 'Message compiler failed' }

          [xml]$project = Get-Content (Join-Path $sourceDir 'sys.vcxproj')
          $namespace = New-Object System.Xml.XmlNamespaceManager($project.NameTable)
          $namespace.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $sources = $project.SelectNodes('//msb:ClCompile', $namespace) |
            ForEach-Object { Join-Path $sourceDir $_.Include }
          if (-not $sources) { throw 'No driver sources found' }

          $arguments = @(
            '/c', '/nologo', '/W4', '/WX-', '/MP', '/O2',
            '/D_X86_=1', '/Di386=1', '/DSTD_CALL',
            '/D_WIN32_WINNT=0x0A00', '/DWINVER=0x0A00',
            '/DWINNT=1', '/DNTDDI_VERSION=0x0A000008',
            '/D_UNICODE', '/DUNICODE',
            '/GF', '/Zp8', '/GS', '/guard:cf', '/Gy',
            '/fp:precise', '/Qspectre', '/Zc:wchar_t-',
            '/Zc:forScope', '/Zc:inline', '/GR-', '/Gz',
            '/wd4603', '/wd4627', '/wd4986', '/wd4987',
            "/FI$(Join-Path $includeRoot 'shared\warning.h')",
            "/I$sourceDir", "/I$messageInclude",
            "/I$(Join-Path $includeRoot 'km')",
            "/I$(Join-Path $includeRoot 'shared')",
            "/I$(Join-Path $includeRoot 'km\crt')",
            '/kernel', "/Fo$outputDir\"
          )
          & $cl @arguments @sources
          if ($LASTEXITCODE -ne 0) { throw 'x86 driver source compilation failed' }
