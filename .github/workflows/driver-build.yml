name: Driver build validation

on:
  push:
    branches:
      - ci/issue-1-driver-build-3287d9d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-current:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install WDK 26100.6584
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne 'ED82C46BD98E0F1D07FD6E5075900E42AEDC3FA5E68C06A8764B3DC5303CFF1B') { throw "WDK installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installer failed: $($process.ExitCode)" }
      - name: Build driver
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=$platform /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:TargetVersion=Windows10 /p:KmdfVersion=1.15 /p:SignMode=Off
            if ($LASTEXITCODE -ne 0) { throw "Driver build failed for $platform" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: error

  driver-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install WDK 22621.5193 for supported x86 validation
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/03f059f8-d6a3-4b9c-b85b-95cc401be222/wdk/wdksetup.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne '23C557139FB1DD9E4EC93C5960A5FDA3C9F97ED42860BE0E20D765417CA1A96D') { throw "WDK installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installer failed: $($process.ExitCode)" }
      - name: Build x86 driver
        shell: pwsh
        run: |
          msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:TargetVersion=Windows10 /p:_NT_TARGET_VERSION=0xA000008 /p:KmdfVersion=1.15 /p:SignMode=Off
          if ($LASTEXITCODE -ne 0) { throw 'Driver build failed for Win32' }
      - uses: actions/upload-artifact@v4
        with:
          name: driver-x86
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: error
