name: Driver build validation

on:
  push:
    branches:
      - ci/issue-1-driver-build-3287d9d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Inspect available WDK versions
        shell: pwsh
        run: Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' | Select-Object -ExpandProperty Name
      - name: Build driver
        shell: pwsh
        run: msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: warn