name: Driver build validation

on:
  push:
    branches:
      - ci/issue-1-driver-build-3287d9d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-current:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install WDK 26100.6584
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne 'ED82C46BD98E0F1D07FD6E5075900E42AEDC3FA5E68C06A8764B3DC5303CFF1B') { throw "WDK installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installer failed: $($process.ExitCode)" }
      - name: Build driver
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=$platform /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:TargetVersion=Windows10 /p:KmdfVersion=1.15 /p:SignMode=Off
            if ($LASTEXITCODE -ne 0) { throw "Driver build failed for $platform" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: error

  driver-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install SDK and WDK 19041.5738 for x86 validation
        shell: pwsh
        run: |
          $installers = @(
            @{
              Name = 'SDK'
              File = 'winsdksetup.exe'
              Uri = 'https://download.microsoft.com/download/e119c04b-71aa-4067-ac3c-360c2e13d209/windowssdk/winsdksetup.exe'
              Hash = 'F7D4526419DF5BFA00ACEE91677B28CB29D60660F5C6A0A747E004EEA0533DE2'
            },
            @{
              Name = 'WDK'
              File = 'wdksetup.exe'
              Uri = 'https://download.microsoft.com/download/1b122713-4a55-4a95-8848-279de832a4c9/wdk/wdksetup.exe'
              Hash = '596D51830EDA95C17486BCE114ECCE3D6DAFE7FECFBDE037828A6FCBC9D4865A'
            }
          )
          foreach ($item in $installers) {
            $installer = Join-Path $env:RUNNER_TEMP $item.File
            Invoke-WebRequest $item.Uri -OutFile $installer
            $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
            if ($hash -ne $item.Hash) { throw "$($item.Name) installer hash mismatch: $hash" }
            $process = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
            if ($process.ExitCode -notin 0, 3010) { throw "$($item.Name) installer failed: $($process.ExitCode)" }
          }
      - name: Build x86 driver
        shell: pwsh
        run: |
          msbuild sys\sys.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0.19041.0 /p:TargetVersion=Windows10 /p:_NT_TARGET_VERSION=0xA000008 /p:KmdfVersion=1.15 /p:SignMode=Off
          if ($LASTEXITCODE -ne 0) { throw 'Driver build failed for Win32' }
      - uses: actions/upload-artifact@v4
        with:
          name: driver-x86
          path: |
            sys/**/Release/*.sys
            sys/**/Release/*.pdb
          if-no-files-found: error
